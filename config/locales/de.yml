  text_github_repository_note_new: Nur GitHub.com; GitLab wird nicht unterstuetzt. Beim Speichern einer vorhandenen Repository-URL wird automatisch der lokale Redmine-Spiegel erstellt. Fuer ein neues Remote-Repository und den Spiegel einen Repository-Namen eingeben.
  text_github_credentials_note: Das Repository-Token wird fuer GitHub-API-Aktionen verwendet und ueberschreibt das Token aus der Serverumgebung. Bei HTTPS-Spiegeln ist der Benutzername optional und wird standardmaessig auf x-access-token gesetzt.
  text_github_register_hook_note: Registriert einen signierten Push-Webhook zur Aktualisierung dieses Redmine-Repositorys. Das GitHub-Token benötigt Schreibrechte für Webhooks.
  text_github_webhook_url_note: Dieser Endpunkt wird vom sicheren, durch das Plugin verwalteten Webhook verwendet und prüft die SHA-256-Signatur von GitHub. Das Signaturgeheimnis wird nie angezeigt.
  text_github_webhook_url_unavailable: Die GitHub-Webhook-URL ist nicht verfügbar. Zuerst den öffentlichen Hostnamen von Redmine konfigurieren.
  text_vcsadmin_base_url_note: Die vollständige VCSAdmin-Repository-API-URL mit /api/v1/scm/repositories/ID am Ende eingeben. In Produktion ist HTTPS erforderlich.
  text_vcsadmin_credentials_note: Das Passwort wird mit Redmines Verschlüsselung für Repository-Zugangsdaten gespeichert. Ein leeres Feld behält das gespeicherte Passwort bei.
  text_scm_creator_not_configured_warning: SCM Creator ist installiert, aber nicht konfiguriert.
  text_scm_repository_created_by_scm: Das Repository wurde vom SCM Creator fuer Redmine angelegt.
  text_scm_repository_destroy_confirmation: Soll das Repository auch aus dem Dateisystem entfernt werden?

  warning_github_hook_registration_failed: Der GitHub-Webhook konnte nicht registriert werden.
  warning_repository_deletion_failed: Das Repository konnte nicht geloescht werden.
  notice_github_connection_ok: "Als %{account} mit GitHub verbunden."
  notice_github_connection_repository_ok: "Als %{account} verbunden; das Repository %{repository} ist erreichbar."
  notice_github_mirror_refreshed: Der GitHub-Spiegel wurde erfolgreich aktualisiert.
  notice_github_webhook_registered: Der sichere GitHub-Webhook wurde erfolgreich registriert.
  notice_vcsadmin_repository_connection_ok: "Mit VCSAdmin verbunden; das Repository %{repository} ist zugänglich."
  notice_vcsadmin_sync_batch_complete: Der begrenzte VCSAdmin-Synchronisierungsdurchlauf wurde abgeschlossen.
  error_github_token_missing: Geben Sie ein GitHub-Token ein oder konfigurieren Sie zuerst das Server-Token.
  error_github_repository_not_accessible: Das GitHub-Repository existiert nicht oder ist mit diesem Token nicht erreichbar.
