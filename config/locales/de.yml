  error_github_connection_failed_generic: GitHub-Verbindung fehlgeschlagen.
  error_github_mirror_refresh_failed: Der GitHub-Spiegel konnte nicht aktualisiert werden.
  error_github_mirror_refresh_in_progress: Eine andere Spiegelaktualisierung läuft bereits.
  error_vcsadmin_configuration: Die VCSAdmin-Connector-Konfiguration ist ungültig oder unvollständig.
  error_vcsadmin_authentication: VCSAdmin-Authentifizierung fehlgeschlagen.
  error_vcsadmin_tls: Die TLS-Zertifikatsprüfung für VCSAdmin ist fehlgeschlagen.
  error_vcsadmin_dns: Der VCSAdmin-Host konnte nicht aufgelöst werden.
  error_vcsadmin_connection_refused: VCSAdmin hat die Verbindung abgelehnt.
  error_vcsadmin_connect_timeout: Zeitüberschreitung beim Verbindungsaufbau zu VCSAdmin.
  error_vcsadmin_read_timeout: Zeitüberschreitung beim Lesen der VCSAdmin-Antwort.
  error_vcsadmin_api_version: Die VCSAdmin-API-Version ist nicht kompatibel.
  error_vcsadmin_capability: VCSAdmin bietet nicht alle vom Connector benötigten Funktionen.
  error_vcsadmin_repository_not_accessible: Das VCSAdmin-Git-Repository existiert nicht oder ist für das konfigurierte Konto nicht zugänglich.
  error_vcsadmin_response_too_large: Die VCSAdmin-Antwort oder ein konfiguriertes Ressourcenlimit wurde überschritten.
  error_vcsadmin_rate_limit: VCSAdmin hat die Anfrage begrenzt.
  error_vcsadmin_service_unavailable: VCSAdmin ist vorübergehend nicht verfügbar.
  error_vcsadmin_invalid_response: VCSAdmin hat ungültiges JSON oder eine unerwartete Antwort geliefert.
  error_vcsadmin_connection: Die VCSAdmin-Verbindung ist fehlgeschlagen.
  error_vcsadmin_request_failed: Die VCSAdmin-Anfrage ist fehlgeschlagen.
  error_vcsadmin_sync_failed: Die VCSAdmin-Changeset-Synchronisierung ist fehlgeschlagen.
  error_vcsadmin_sync_in_progress: Für dieses Repository läuft bereits eine Synchronisierung.
  error_vcsadmin_sync_migration_required: Die VCSAdmin-Sperrtabelle fehlt. Führen Sie die Plugin-Migrationen aus.
  error_vcsadmin_file_too_large: Diese Datei überschreitet ein Anzeige-Limit von VCSAdmin oder dem Redmine-Connector.
  error_vcsadmin_binary_unavailable: VCSAdmin API v1 stellt keine binären Dateiinhalte bereit.
  error_vcsadmin_diff_truncated: "VCSAdmin hat diesen Diff bei %{limit} Bytes abgeschnitten; der unvollständige Diff wird nicht angezeigt."
  error_vcsadmin_arbitrary_comparison_unsupported: VCSAdmin API v1 unterstützt keinen beliebigen Vergleich zwischen zwei Revisionen.

  text_cannot_be_changed_later: Kann später nicht mehr geändert werden.
  text_cannot_be_used_redmine_auth: Die Authentifizierung über Redmine kann mit diesem Repository Namen nicht verwendet werden.

