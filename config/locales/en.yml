  text_github_repository_note_new: GitHub.com only; GitLab is not supported. Saving an existing repository URL automatically creates its local Redmine mirror. Enter a repository name to create the remote repository and mirror together.
  text_github_credentials_note: The repository token is used for GitHub API operations and overrides the server environment token. For HTTPS mirrors, the username is optional and defaults to x-access-token.
  text_github_register_hook_note: Register a signed push webhook that refreshes this Redmine repository. The GitHub token requires webhook write permission.
  text_github_webhook_url_note: This endpoint is used by the secure plugin-managed webhook and verifies GitHub's SHA-256 signature. The signing secret is never displayed.
  text_github_webhook_url_unavailable: The GitHub webhook URL is unavailable. Configure Redmine's public host name first.
  text_vcsadmin_base_url_note: Enter the complete VCSAdmin repository API URL ending in /api/v1/scm/repositories/ID. HTTPS is required in production.
  text_vcsadmin_credentials_note: The password is stored using Redmine's repository credential ciphering. Leaving this field empty preserves the stored password.
  text_cannot_be_changed_later: Cannot be changed later.
  text_cannot_be_used_redmine_auth: Redmine based authentication can not be used with this repository name.
  text_scm_creator_not_configured_warning: SCM Creator installed but not configured.
  text_scm_repository_created_by_scm: The repository on the file system was created especially for Redmine. By deleting its Redmine entry you may make it useless.
  text_scm_repository_destroy_confirmation: Do you want to remove the repository from the file system as well?

  warning_github_hook_registration_failed: GitHub push webhook registration failed.
